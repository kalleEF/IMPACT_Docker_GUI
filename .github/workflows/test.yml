name: IMPACT Docker GUI - Tests

on:
  push:
    # main      = the main branch.
    # dev-v2.1  = the development branch for version 2.1; the remote-mode
    #             redesign is built there.
    # (The branch 'develop' used to be listed here. It no longer exists on
    #  GitHub, and nothing else in this file referred to it, so it was removed.)
    branches: [main, dev-v2.1]
    # A push starts this workflow only when it changes a file below one of
    # these paths. A push that changes only the documentation starts nothing.
    paths:
      - 'current_version/**'
      - 'tests/**'
      # Folder for the workstation commands of the redesign. It does not exist
      # yet; it is listed already so that CI starts as soon as files appear.
      - 'workstation/**'
      # Already covered by 'tests/**'. Listed on its own line because the
      # temporary probe jobs at the end of this file react to this folder.
      - 'tests/Probes/**'
      # The reference copy of the folder docker_setup that every model
      # repository carries, and its tests. The second line is already
      # covered by 'tests/**'. Both are listed because the job
      # docker-setup-tests reacts to exactly these two folders.
      - 'docker_setup/**'
      - 'tests/docker_setup/**'
      - '.github/workflows/test.yml'
  pull_request:
    # Pull requests INTO one of these branches (any changed file).
    branches: [main, dev-v2.1]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run E2E tests (ImageValidation + RemoteE2E)'
        type: boolean
        default: false
      run_probes:
        description: 'Run the TEMPORARY feasibility probes (Windows tunnel + Ubuntu workstation)'
        type: boolean
        default: false
  schedule:
    # E2E tests weekly on Sunday at 03:00 UTC
    - cron: '0 3 * * 0'

# The version of Pester (the test tool for PowerShell) that every job installs.
# It is fixed on purpose: the tests are checked with this version, and a new
# Pester release can change how tests behave, for example how "mocks" (the
# stand-ins for commands during a test) handle the calls they are given. With a
# fixed version, a new Pester release cannot turn the tests red overnight.
# The tests need PowerShell 7.4 or newer (pwsh): the IMPACT module needs 7.3 or
# newer, and in PowerShell 7 Pester 6 needs 7.4 or newer. Every step that runs
# Pester uses "shell: pwsh", and the windows-latest and ubuntu-latest runners
# come with a new enough version.
# To move to a newer version: read its release notes, change this line and
# $requiredPesterVersion in tests/Invoke-Tests.ps1 to the same value, and run
# all test suites with it.
env:
  PESTER_VERSION: '6.2.0'

permissions:
  contents: read

# ═══════════════════════════════════════════════════════════════════════════════
#  Architecture note:
#  The IMPACT Docker GUI is a Windows-only PowerShell + WinForms app.
#  However, windows-latest GitHub runners only support Windows containers
#  (no Docker Desktop / WSL2), so Linux-container tests must run on Ubuntu
#  with pwsh. The PowerShell module functions are cross-platform.
#
#  Test tiers:
#    1. Unit (Windows)           - pure logic, no deps
#    2. Integration (Windows)    - mocked Docker/SSH, WinForms loads
#    3. DockerSsh (Ubuntu)       - SSH to SSHD container, tests remote funcs
#    4. ImageValidation (Ubuntu) - builds real IMPACT image, validates container
#    5. RemoteE2E (Ubuntu)       - full SSH -> Docker build -> container lifecycle
#
#  Beside the tiers (not Pester, no PowerShell):
#    docker_setup (Ubuntu)       - the start-up scripts of the model images in
#                                  docker_setup/, with real containers
#                                  (tests/docker_setup/run-tests.sh)
#
#  When does which job run:
#    Tiers 1 to 3   every push to main or dev-v2.1 that changes one of the
#                   paths listed above, every pull request into main or
#                   dev-v2.1, every manual start, and the weekly schedule.
#    Tiers 4 and 5  manual start with run_e2e ticked, and the weekly schedule.
#    docker_setup   every push to main or dev-v2.1 and every pull request
#                   into main or dev-v2.1 that changes a file below
#                   docker_setup/ or tests/docker_setup/ (the job
#                   docker-setup-gate looks this up), every manual start, and
#                   the weekly schedule.
#
#  TEMPORARY feasibility probes (the last three jobs in this file):
#    They are not tests of the GUI. They find out whether GitHub's runners can
#    host two test tiers planned for the remote-mode redesign (an SSH tunnel on
#    Windows, account and sshd set-up on the workstation). They run only on a
#    manual start with run_probes ticked, and on a push to dev-v2.1 that
#    changes a file under tests/Probes/. They never run for main, for pull
#    requests or on the weekly schedule. Delete the three jobs, the input
#    run_probes and the folder tests/Probes once the questions are answered.
# ═══════════════════════════════════════════════════════════════════════════════

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  #  Unit tests - Windows (primary platform for the script)
  # ─────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -RequiredVersion $env:PESTER_VERSION -SkipPublisherCheck

      - name: Run Unit Tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/Unit.Tests.ps1'
          $config.Filter.Tag = @('Unit')
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = './tests/TestResults-Unit.xml'
          Invoke-Pester -Configuration $config

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: tests/TestResults-Unit.xml

  # ─────────────────────────────────────────────────────────────────────────
  #  Integration tests - Windows (needs WinForms, mocked Docker/SSH)
  # ─────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (Windows)
    runs-on: windows-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -RequiredVersion $env:PESTER_VERSION -SkipPublisherCheck

      - name: Verify Docker CLI is available
        shell: pwsh
        run: |
          docker --version
          if ($LASTEXITCODE -ne 0) { Write-Error 'Docker CLI not available'; exit 1 }

      - name: Run Integration Tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/Integration.Tests.ps1'
          $config.Filter.Tag = @('Integration')
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = './tests/TestResults-Integration.xml'
          Invoke-Pester -Configuration $config

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: tests/TestResults-Integration.xml

  # ─────────────────────────────────────────────────────────────────────────
  #  Docker SSH tests - Ubuntu (needs Linux containers for SSHD)
  #  Tests the module's SSH functions against a real SSHD container.
  #  It also runs the production in-container SSH setup command
  #  (Get-ContainerSshSetupCommand) in a real container built from the SSHD
  #  image and checks the key, known_hosts and a strict host-key check
  #  against github.com, without a GitHub token (F74). This used to happen
  #  only in the weekly E2E jobs.
  # ─────────────────────────────────────────────────────────────────────────
  docker-ssh-tests:
    name: Docker SSH Tests (Ubuntu)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -RequiredVersion $env:PESTER_VERSION -SkipPublisherCheck

      - name: Build SSHD Test Container
        run: |
          docker build -t impact-sshd-test -f tests/Helpers/SshdContainer.Dockerfile .

      - name: Start SSHD Container with SSH Key
        run: |
          mkdir -p /tmp/test_ssh
          ssh-keygen -t ed25519 -C "ci-test" -f /tmp/test_ssh/id_ed25519_testuser -N "" -q

          docker run -d -p 2222:22 --name sshd-test impact-sshd-test

          docker cp /tmp/test_ssh/id_ed25519_testuser.pub sshd-test:/home/testuser/.ssh/authorized_keys
          docker exec sshd-test chown testuser:testuser /home/testuser/.ssh/authorized_keys
          docker exec sshd-test chmod 600 /home/testuser/.ssh/authorized_keys

          sleep 2

          # Verify connectivity
          ssh -p 2222 -i /tmp/test_ssh/id_ed25519_testuser \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o IdentitiesOnly=yes \
              testuser@localhost "echo SSH_OK"

      - name: Run SSH Target Tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION

          $env:IMPACT_TEST_SSH_HOST = 'localhost'
          $env:IMPACT_TEST_SSH_PORT = '2222'
          $env:IMPACT_TEST_SSH_USER = 'testuser'
          $env:IMPACT_TEST_SSH_KEY  = '/tmp/test_ssh/id_ed25519_testuser'

          $config = New-PesterConfiguration
          $config.Run.Path = './tests/DockerSsh.Tests.ps1'
          $config.Filter.Tag = @('DockerSsh')
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = './tests/TestResults-DockerSsh.xml'
          Invoke-Pester -Configuration $config

      - name: Cleanup SSHD Container
        if: always()
        run: |
          docker stop sshd-test 2>/dev/null || true
          docker rm sshd-test 2>/dev/null || true
          rm -rf /tmp/test_ssh

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-docker-ssh
          path: tests/TestResults-DockerSsh.xml

  # ─────────────────────────────────────────────────────────────────────────
  #  Image validation - Ubuntu (builds real IMPACT image, validates container)
  #  Only on manual dispatch (with run_e2e=true) or weekly schedule.
  #  It clones the model repository IMPACT-NCD-Germany_Base and builds its
  #  image. Before the build, it lays the start-up files of this
  #  repository's reference copy docker_setup/ over the clone (the variable
  #  IMPACT_E2E_DOCKER_SETUP_DIR in the test step below; see the section
  #  "1b" in tests/ImageValidation.Tests.ps1). So the real model image is
  #  tested with the start-up scripts of this repository, also while the
  #  model repository still holds an older version of them. Remove the
  #  variable to test exactly what the model repository holds.
  # ─────────────────────────────────────────────────────────────────────────
  image-validation:
    name: Image Validation (Ubuntu)
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true')
      || github.event_name == 'schedule'
    needs: [docker-ssh-tests]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -RequiredVersion $env:PESTER_VERSION -SkipPublisherCheck

      - name: Verify Docker
        run: |
          docker --version
          docker info

      - name: Run Preflight Tests (ImageValidation)
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/Preflight.Tests.ps1'
          $config.Filter.Tag = @('Preflight')
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = './tests/TestResults-Preflight.xml'
          Invoke-Pester -Configuration $config

      - name: Run Image Validation Tests
        shell: pwsh
        env:
          IMPACT_E2E_GITHUB_TOKEN: ${{ secrets.IMPACT_E2E_GITHUB_TOKEN }}
          # Build the model image with the reference docker_setup of this repository.
          IMPACT_E2E_DOCKER_SETUP_DIR: ${{ github.workspace }}/docker_setup
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/ImageValidation.Tests.ps1'
          $config.Filter.Tag = @('ImageValidation')
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = './tests/TestResults-ImageValidation.xml'
          Invoke-Pester -Configuration $config

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-image-validation
          path: tests/TestResults-ImageValidation.xml

      - name: Collect diagnostic artifacts (image-validation)
        if: failure()
        run: |
          mkdir -p /tmp/ci-artifacts/image-validation
          docker ps -a --no-trunc > /tmp/ci-artifacts/image-validation/docker-ps.txt || true
          docker images --no-trunc > /tmp/ci-artifacts/image-validation/docker-images.txt || true
          docker inspect impact_imgval_test_container > /tmp/ci-artifacts/image-validation/impact_imgval_test_container.inspect.json 2>/dev/null || true
          docker logs impact_imgval_test_container > /tmp/ci-artifacts/image-validation/impact_imgval_test_container.logs 2>/dev/null || true
          docker inspect impactncd_germany_imgval_test > /tmp/ci-artifacts/image-validation/impactncd_germany_imgval_test.inspect.json 2>/dev/null || true
          if ls /tmp/impact_imgval_* 1> /dev/null 2>&1; then tar -czf /tmp/ci-artifacts/image-validation/tmp-archives.tar.gz /tmp/impact_imgval_* || true; fi
          ls -la /tmp || true
        shell: bash

      - name: Upload diagnostic artifacts (image-validation)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-validation-diagnostics
          path: /tmp/ci-artifacts/image-validation

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker stop impact_imgval_test_container 2>/dev/null || true
          docker rm impact_imgval_test_container 2>/dev/null || true
          docker rmi impactncd_germany_imgval_test 2>/dev/null || true

  # ─────────────────────────────────────────────────────────────────────────
  #  Remote E2E - Ubuntu with pwsh (simulates Windows -> SSH -> Docker)
  #  Uses a workstation container with Docker-out-of-Docker (DooD).
  #  Full flow: SSH into workstation -> clone repo -> build image -> start
  #  container -> validate RStudio + global.R + git pull.
  #  Only on manual dispatch (with run_e2e=true) or weekly schedule.
  # ─────────────────────────────────────────────────────────────────────────
  remote-e2e:
    name: Remote E2E (Ubuntu + DooD)
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true')
      || github.event_name == 'schedule'
    needs: [docker-ssh-tests]
    timeout-minutes: 60
    # Set for the whole job (not only for the test step), so the Preflight step can
    # also find and check this key (F109: it used to look only in another folder).
    env:
      IMPACT_REMOTE_E2E_SSH_HOST: localhost
      IMPACT_REMOTE_E2E_SSH_PORT: '2222'
      IMPACT_REMOTE_E2E_SSH_USER: testuser
      IMPACT_REMOTE_E2E_SSH_KEY: /tmp/remote_e2e_ssh/id_test
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -RequiredVersion $env:PESTER_VERSION -SkipPublisherCheck

      - name: Build Workstation Container
        run: |
          docker build -t impact-workstation-test -f tests/Helpers/WorkstationContainer.Dockerfile .

      - name: Start Workstation Container with DooD
        run: |
          mkdir -p /tmp/remote_e2e_ssh
          ssh-keygen -t ed25519 -C "remote-e2e-ci" -f /tmp/remote_e2e_ssh/id_test -N "" -q

          # Validate the generated private key is usable (not passphrase-protected)
          ssh-keygen -y -f /tmp/remote_e2e_ssh/id_test >/dev/null || (echo "Generated SSH key unusable" && exit 1)

          # Start with Docker socket mounted (Docker-out-of-Docker)
          docker run -d -p 2222:22 \
              -v /var/run/docker.sock:/var/run/docker.sock \
              --name workstation-test impact-workstation-test

          # Copy SSH key
          docker cp /tmp/remote_e2e_ssh/id_test.pub workstation-test:/home/testuser/.ssh/authorized_keys
          docker exec workstation-test chown testuser:testuser /home/testuser/.ssh/authorized_keys
          docker exec workstation-test chmod 600 /home/testuser/.ssh/authorized_keys

          sleep 3

          # Verify SSH
          ssh -p 2222 -i /tmp/remote_e2e_ssh/id_test \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o IdentitiesOnly=yes \
              testuser@localhost "echo SSH_OK"

          # Verify Docker through SSH
          ssh -p 2222 -i /tmp/remote_e2e_ssh/id_test \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o IdentitiesOnly=yes \
              testuser@localhost "docker --version"

      - name: Run Preflight Tests (RemoteE2E)
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/Preflight.Tests.ps1'
          $config.Filter.Tag = @('Preflight')
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = './tests/TestResults-Preflight.xml'
          Invoke-Pester -Configuration $config

      - name: Run Remote E2E Tests
        shell: pwsh
        env:
          IMPACT_E2E_GITHUB_TOKEN: ${{ secrets.IMPACT_E2E_GITHUB_TOKEN }}
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION

          # IMPACT_REMOTE_E2E_SSH_* come from the job-level 'env:' above.
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/RemoteE2E.Tests.ps1'
          $config.Filter.Tag = @('RemoteE2E')
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = './tests/TestResults-RemoteE2E.xml'
          Invoke-Pester -Configuration $config

      - name: Collect diagnostic artifacts (remote-e2e)
        if: failure()
        run: |
          mkdir -p /tmp/ci-artifacts/remote-e2e
          docker ps -a --no-trunc > /tmp/ci-artifacts/remote-e2e/docker-ps.txt || true
          docker images --no-trunc > /tmp/ci-artifacts/remote-e2e/docker-images.txt || true
          docker inspect workstation-test > /tmp/ci-artifacts/remote-e2e/workstation-test.inspect.json 2>/dev/null || true
          docker logs workstation-test > /tmp/ci-artifacts/remote-e2e/workstation-test.logs 2>/dev/null || true
          docker inspect impact_remote_e2e_inner > /tmp/ci-artifacts/remote-e2e/impact_remote_e2e_inner.inspect.json 2>/dev/null || true
          docker logs impact_remote_e2e_inner > /tmp/ci-artifacts/remote-e2e/impact_remote_e2e_inner.logs 2>/dev/null || true
          if ls /tmp/remote_e2e_ssh* 1> /dev/null 2>&1; then tar -czf /tmp/ci-artifacts/remote-e2e/tmp-archives.tar.gz /tmp/remote_e2e_ssh* || true; fi
          ls -la /tmp || true
        shell: bash

      - name: Upload diagnostic artifacts (remote-e2e)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: remote-e2e-diagnostics
          path: /tmp/ci-artifacts/remote-e2e

      - name: Cleanup
        if: always()
        run: |
          # Stop inner container (running via DooD on host daemon)
          docker stop impact_remote_e2e_inner 2>/dev/null || true
          docker rm impact_remote_e2e_inner 2>/dev/null || true
          docker rmi impactncd_remote_e2e_test 2>/dev/null || true

          # Stop workstation container
          docker stop workstation-test 2>/dev/null || true
          docker rm workstation-test 2>/dev/null || true
          docker rmi impact-workstation-test 2>/dev/null || true

          rm -rf /tmp/remote_e2e_ssh

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-remote-e2e
          path: tests/TestResults-RemoteE2E.xml

  # ─────────────────────────────────────────────────────────────────────────
  #  docker_setup gate - decides whether the docker_setup tests run.
  #  The folder docker_setup/ is the reference copy of the folder that every
  #  model repository carries (the Dockerfiles and the start-up scripts of
  #  the model images); tests/docker_setup/ holds its tests. These tests
  #  take about 20 minutes, so a push or a pull request runs them only when
  #  it changes a file below one of these two folders.
  #  A push starts this workflow when it changes any path of the list under
  #  "on: push", and a pull request starts it for any change. A job
  #  condition ("if:") cannot see which files changed. So this small job
  #  looks it up with git, as the probe gate further down does, and hands
  #  the answer ("true" or "false") to the job docker-setup-tests as its
  #  output "run_docker_setup". On a manual start and on the weekly
  #  schedule the answer is always "true".
  # ─────────────────────────────────────────────────────────────────────────
  docker-setup-gate:
    name: 'docker_setup gate: should the docker_setup tests run?'
    runs-on: ubuntu-latest
    outputs:
      run_docker_setup: ${{ steps.decide.outputs.run_docker_setup }}
    steps:
      # Only a push and a pull request need the history.
      - uses: actions/checkout@v4
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          # 0 = fetch the whole history. The step below compares two commits,
          # and both must be present in the checkout.
          fetch-depth: 0

      - name: Decide
        id: decide
        shell: bash
        # The values from GitHub are handed over as environment variables and
        # not pasted into the script text. That is the safe way to use them.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # When in doubt, the tests run: a run too many costs a few minutes,
          # a run too few can let a broken start-up script through.
          run_docker_setup=true
          base=""
          if [ "$EVENT_NAME" = "push" ]; then
            # PUSH_BEFORE is the commit the branch pointed to before the push,
            # PUSH_AFTER the commit it points to now. "A..B" (two dots) compares
            # the two commits directly.
            base="$PUSH_BEFORE"; head="$PUSH_AFTER"; range="$PUSH_BEFORE..$PUSH_AFTER"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            # PR_BASE is a commit of the target branch, PR_HEAD the newest
            # commit of the pull request. "A...B" (three dots) compares B with
            # the commit where the pull request branched off from A, so it
            # shows exactly the changes of the pull request.
            base="$PR_BASE"; head="$PR_HEAD"; range="$PR_BASE...$PR_HEAD"
          fi
          if [ -z "$base" ]; then
            echo "Manual start or weekly schedule ($EVENT_NAME): the docker_setup tests run."
          # "git cat-file -e X^{commit}" succeeds when commit X is in the checkout.
          elif ! git cat-file -e "${base}^{commit}" 2>/dev/null || ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
            # After a forced push, or for the first push of a branch, the old
            # commit is not available.
            echo "A commit to compare with is not available ($base, $head). To be safe, the docker_setup tests run."
          # The "--" ends the options; the two folder names after it limit the
          # comparison to these folders. "if x=$(command)" takes the branch
          # when the command succeeded.
          elif changed="$(git diff --name-only "$range" -- docker_setup/ tests/docker_setup/)"; then
            if [ -n "$changed" ]; then
              echo "These files below docker_setup/ or tests/docker_setup/ changed, so the docker_setup tests run:"
              echo "$changed"
            else
              run_docker_setup=false
              echo "Nothing below docker_setup/ or tests/docker_setup/ changed: the docker_setup tests do not run."
            fi
          else
            echo "git diff failed. To be safe, the docker_setup tests run."
          fi
          # Lines written to the file named in GITHUB_OUTPUT become outputs of this step.
          echo "run_docker_setup=$run_docker_setup" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────
  #  docker_setup tests - Ubuntu (real containers; bash and Docker, no Pester)
  #  tests/docker_setup/run-tests.sh builds a test image with the real
  #  docker_setup/Dockerfile.IMPACTncdGER, on a stand-in for the large
  #  prerequisite image of the models (the Rocker image named in
  #  docker_setup/Dockerfile.prerequisite.IMPACTncdGER plus a few packages)
  #  and with a tiny stand-in repository. It starts containers with the
  #  options the GUI uses and checks about 490 things: user and group
  #  numbers, that nothing in a mounted folder changes, the ready marker,
  #  the RStudio sign-in, R sessions, git against a stand-in SSH server, and
  #  GitHub's host keys against the real github.com.
  #  Runs when the gate above says "true". Needs no token: the test key is
  #  made during the run, and against the real github.com the tests only
  #  check the host key.
  # ─────────────────────────────────────────────────────────────────────────
  docker-setup-tests:
    name: docker_setup Tests (Ubuntu)
    runs-on: ubuntu-latest
    needs: [docker-setup-gate]
    if: needs.docker-setup-gate.outputs.run_docker_setup == 'true'
    timeout-minutes: 60
    # IMPACT_TEST_TMP in the steps below: where the two test scripts create
    # their work folders, with the folders they mount into the test
    # containers. runner.temp is the runner's own temporary folder, emptied
    # at the start and at the end of every job. (The runner context exists
    # only inside steps, so each step sets the variable itself.)
    steps:
      - uses: actions/checkout@v4

      - name: Show the Docker version
        run: docker version

      # The build group of run-tests.sh alone: it downloads the Rocker image
      # (about 760 MB), builds the stand-in prerequisite image (with apt-get)
      # and the test image, and checks the images. "--only" takes a pattern
      # for the names of the test groups. No test group is called "build",
      # so only the build runs, which always runs first. Exit code 2 means
      # that the images could not be built, 1 that a check of them failed.
      - name: Build the test images
        timeout-minutes: 20
        env:
          IMPACT_TEST_TMP: ${{ runner.temp }}
        run: bash tests/docker_setup/run-tests.sh --only '^build$'

      # All test groups. The images of the step above are reused (the build
      # runs again, from Docker's build cache). The script prints one line
      # per test ("ok", "FAIL" with the reason, or "skip" with the reason)
      # and a summary. Exit code 1 (a test failed) or 2 (the tests could not
      # run) fails the job.
      - name: Run the docker_setup tests
        timeout-minutes: 25
        env:
          IMPACT_TEST_TMP: ${{ runner.temp }}
        run: bash tests/docker_setup/run-tests.sh

      # Twelve deliberate mistakes ("mutants") in entrypoint.sh and
      # git-identity.sh, each of which would re-own other people's files or
      # let git accept a false github.com. For each mutant the script runs
      # the matching test groups and checks that the tests named for it fail.
      # About 11 minutes. Runs only when every step above passed (the default
      # for a step): on top of failing tests, a mutant run says nothing.
      # It runs every time this job runs, on purpose:
      #   - It can only find something new when the scripts or the tests
      #     change, and exactly then this job runs. A check once a week would
      #     report a weakened test days after it was merged.
      #   - A change to entrypoint.sh or git-identity.sh can remove a line that
      #     a mutant changes. The script then ends with exit code 2, and that
      #     belongs to the push that made the change.
      #   - A mutant counts as caught when the tests named for it fail. A
      #     test that fails by chance elsewhere cannot make this step red.
      #   - This repository is public, so the minutes on GitHub's runners
      #     cost nothing, and pushes that change these folders are rare.
      - name: Check that the tests notice deliberate mistakes
        timeout-minutes: 25
        env:
          IMPACT_TEST_TMP: ${{ runner.temp }}
        run: bash tests/docker_setup/check-the-tests.sh

      # The test image above is built with the reference .dockerignore, but
      # the stand-in repository holds none of the files it excludes. This
      # step copies the stand-in repository, adds files that must stay out of
      # an image and the reference .dockerignore, builds a throw-away image
      # that copies the whole build context (as Dockerfile.IMPACTncdGER does)
      # and lists what arrived. It runs also when an earlier step failed
      # ("!cancelled()": unless the run was cancelled), because its result
      # does not depend on theirs.
      # BUILDX_GIT_INFO=false keeps Docker from reading the dummy .git folder.
      - name: Check the reference .dockerignore with a real build
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          set -eu
          ctx="$(mktemp -d)"
          cp -r tests/docker_setup/standin/repository/. "$ctx/"
          mkdir -p "$ctx/docker_setup"
          cp -r docker_setup/. "$ctx/docker_setup/"
          cp docker_setup/dockerignore_for_repository_root "$ctx/.dockerignore"
          # Files that must stay out of the image, at the top and in a subfolder.
          mkdir -p "$ctx/.git" "$ctx/.Rproj.user" "$ctx/outputs/run1" "$ctx/inputs/synthpop" "$ctx/Rpackage/.Rproj.user"
          for f in .git/HEAD .Rproj.user/state outputs/run1/result.csv inputs/synthpop/pop.fst .Rhistory .RData \
                   docker_setup/.env Rpackage/.Rproj.user/state Rpackage/.Rhistory; do
            echo x > "$ctx/$f"
          done
          # The throw-away image uses the Rocker image of the prerequisite Dockerfile, which
          # the steps above have downloaded already.
          base="$(sed -n 's/^FROM[[:space:]]\{1,\}\([^[:space:]]\{1,\}\).*/\1/p' docker_setup/Dockerfile.prerequisite.IMPACTncdGER | head -n 1)"
          printf 'FROM %s\nCOPY . /context/\nRUN cd /context && find . | LC_ALL=C sort > /context-list.txt\n' "$base" > "$ctx.Dockerfile"
          BUILDX_GIT_INFO=false docker build --no-cache -q -f "$ctx.Dockerfile" -t dockerignore-check "$ctx" > /dev/null
          docker run --rm --entrypoint cat dockerignore-check /context-list.txt > "$ctx.list"
          fail=0
          for p in ./.git ./.Rproj.user ./outputs/run1 ./inputs/synthpop/pop.fst ./.Rhistory ./.RData \
                   ./docker_setup/.env ./Rpackage/.Rproj.user ./Rpackage/.Rhistory; do
            if grep -qx -- "$p" "$ctx.list"; then echo "FAIL $p reached the image"; fail=1; else echo "ok   $p stays out of the image"; fi
          done
          for p in ./outputs ./inputs/synthpop ./docker_setup/entrypoint.sh ./docker_setup/git-identity.sh \
                   ./docker_setup/impact-ready.sh ./Rpackage/IMPACTncd_Ger_model_pkg/DESCRIPTION; do
            if grep -qx -- "$p" "$ctx.list"; then echo "ok   $p is in the image"; else echo "FAIL $p is missing from the image"; fail=1; fi
          done
          docker image rm dockerignore-check > /dev/null
          rm -rf "$ctx" "$ctx.Dockerfile" "$ctx.list"
          exit "$fail"

      # check-the-tests.sh keeps the full output of a mutant that was not
      # caught as check-the-tests.<mutant>.log in its work folder.
      - name: Upload the logs of mutants that were not caught
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-setup-mutant-logs
          path: ${{ runner.temp }}/check-the-tests.*.log
          if-no-files-found: ignore

  # ═════════════════════════════════════════════════════════════════════════
  #  TEMPORARY FEASIBILITY PROBES (work package 0 of the remote-mode redesign)
  #
  #  The three jobs below are NOT tests of the IMPACT Docker GUI, and what
  #  they find does not make a push "red": each probe script prints PASS /
  #  FAIL lines and a summary table, and ends with exit code 0. (A red probe
  #  job means that the probe script itself could not run, or ran out of
  #  time.) Read the summary on the page of the workflow run, or download
  #  the artifact of the job.
  #
  #  They run only
  #    - on a manual start with the box "run_probes" ticked, or
  #    - on a push to dev-v2.1 that changes a file under tests/Probes/.
  #  They do not run on pushes to main, on pull requests or on the weekly
  #  schedule.
  #
  #  Delete all three jobs (and the input run_probes, and tests/Probes/) when
  #  the two questions are answered.
  # ═════════════════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────────────────────────────────
  #  PROBE gate - decides whether the two probe jobs run.
  #  A job condition ("if:") cannot see which files a push changed. So this
  #  small job looks it up with git and hands the answer ("true" or "false")
  #  to the two probe jobs as its output "run_probes".
  # ─────────────────────────────────────────────────────────────────────────
  probe-gate:
    name: 'PROBE gate (temporary): should the probes run?'
    runs-on: ubuntu-latest
    # Start this job only for the two cases named above. In every other case
    # (main, pull request, schedule, manual start without run_probes) it is
    # skipped, and jobs that "need" a skipped job are skipped as well.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_probes == 'true')
      || (github.event_name == 'push' && github.ref == 'refs/heads/dev-v2.1')
    outputs:
      run_probes: ${{ steps.decide.outputs.run_probes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 0 = fetch the whole history. The step below compares two commits,
          # and both must be present in the checkout.
          fetch-depth: 0

      - name: Decide
        id: decide
        shell: bash
        # The values from GitHub are handed over as environment variables and
        # not pasted into the script text. That is the safe way to use them.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          run_probes=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # The job condition has already checked that run_probes is ticked.
            run_probes=true
            echo "Manual start with run_probes ticked: the probes run."
          else
            # A push to dev-v2.1. BEFORE_SHA is the commit the branch pointed
            # to before the push, AFTER_SHA the commit it points to now.
            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              base="$BEFORE_SHA"
            else
              # After a forced push, or for the first push of a branch, the
              # old commit is not available. Then look at the newest commit only.
              base="${AFTER_SHA}~1"
              echo "The commit before the push is not available; comparing with the parent of the newest commit."
            fi
            changed="$(git diff --name-only "$base" "$AFTER_SHA" -- tests/Probes/ || true)"
            if [ -n "$changed" ]; then
              run_probes=true
              echo "This push changed files under tests/Probes/, so the probes run:"
              echo "$changed"
            else
              echo "This push changed nothing under tests/Probes/: the probes do not run."
            fi
          fi
          # Lines written to the file named in GITHUB_OUTPUT become outputs of this step.
          echo "run_probes=$run_probes" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────
  #  PROBE 1 - SSH tunnel on Windows (temporary)
  #  Question: can a Windows runner be its own SSH server, so that a later
  #  test tier can start the tunnel exactly as the GUI will (hidden ssh.exe
  #  with -N -L ...) and request a page through it?
  #  Script with all details: tests/Probes/Probe-WindowsTunnel.ps1
  # ─────────────────────────────────────────────────────────────────────────
  probe-tunnel-windows:
    name: 'PROBE (temporary): SSH tunnel on Windows'
    runs-on: windows-latest
    needs: [probe-gate]
    if: needs.probe-gate.outputs.run_probes == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run the Windows tunnel probe
        shell: pwsh
        # Installing the Windows OpenSSH Server can take several minutes. The
        # limit on this step (and not only on the job) makes sure that the
        # upload step below still runs when the probe hangs.
        timeout-minutes: 35
        run: |
          ./tests/Probes/Probe-WindowsTunnel.ps1 -OutputDirectory ./tests/artifacts/probes/windows-tunnel

      # always() = upload also when the step above failed or ran out of time.
      # The artifact contains probe-output.txt (everything the script
      # printed), the log files of the tunnels and the log of the SSH server.
      - name: Upload probe output and tunnel logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-tunnel-windows
          path: tests/artifacts/probes/windows-tunnel/
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────
  #  PROBE 2 - workstation on Ubuntu (temporary)
  #  Question: can an Ubuntu runner play the shared workstation, so that a
  #  later test tier can run the real set-up commands (personal accounts with
  #  key-only login, sshd rules for the group "impact", Docker through SSH,
  #  tunnel to a container on 127.0.0.1:8787)?
  #  Script with all details: tests/Probes/probe-workstation.sh
  # ─────────────────────────────────────────────────────────────────────────
  probe-workstation-ubuntu:
    name: 'PROBE (temporary): workstation on Ubuntu'
    runs-on: ubuntu-latest
    needs: [probe-gate]
    if: needs.probe-gate.outputs.run_probes == 'true'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Run the workstation probe
        timeout-minutes: 20
        run: |
          bash tests/Probes/probe-workstation.sh --output-dir tests/artifacts/probes/workstation

      # The artifact contains probe-output.txt (everything the script
      # printed), the ssh log of every tunnel attempt, the settings sshd
      # applied, and the log of the SSH server.
      - name: Upload probe output and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-workstation-ubuntu
          path: tests/artifacts/probes/workstation/
          if-no-files-found: warn
